name: Build Sổ Tay

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    name: App iPhone / iPad (.ipa)
    # Không dùng nữa (nhóm dùng bản web). Chỉ chạy khi bấm Run workflow bằng tay.
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Cài thư viện
        run: npm ci

      - name: Dựng giao diện app
        env:
          FIREBASE_CONFIG: ${{ secrets.FIREBASE_CONFIG }}
        run: npm run build

      - name: Gắn file GoogleService-Info.plist
        env:
          GSI: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
        run: |
          if [ -z "$GSI" ]; then echo "::error::Chưa có secret GOOGLE_SERVICE_INFO_PLIST"; exit 1; fi
          if echo "$GSI" | head -c 20 | grep -q "<?xml"; then
            printf '%s' "$GSI" > ios/App/App/GoogleService-Info.plist
          else
            echo "$GSI" | base64 --decode > ios/App/App/GoogleService-Info.plist
          fi

      - name: Đồng bộ dự án iOS
        run: |
          npx cap sync ios
          npm run ios:setup

      - name: Kiểm tra có tài khoản Apple Developer chưa
        id: mode
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          if [ -n "$ASC_KEY_ID" ]; then echo "signed=true" >> "$GITHUB_OUTPUT"; echo "→ Ký app và đẩy lên TestFlight";
          else echo "signed=false" >> "$GITHUB_OUTPUT"; echo "→ Chưa có Apple Developer: build bản không ký (cài bằng Sideloadly)"; fi

      - name: Chuẩn bị khoá App Store Connect
        if: steps.mode.outputs.signed == 'true'
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          if echo "$ASC_KEY_P8" | grep -q "BEGIN PRIVATE KEY"; then printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc/key.p8";
          else echo "$ASC_KEY_P8" | base64 --decode > "$RUNNER_TEMP/asc/key.p8"; fi

      - name: Build + ký (TestFlight)
        if: steps.mode.outputs.signed == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -o pipefail
          AUTH="-allowProvisioningUpdates -authenticationKeyPath $RUNNER_TEMP/asc/key.p8 -authenticationKeyID $ASC_KEY_ID -authenticationKeyIssuerID $ASC_ISSUER_ID"
          xcodebuild \
            -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/SoTay.xcarchive" \
            -skipPackagePluginValidation -skipMacroValidation \
            $AUTH \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION=$(( ${{ github.run_number }} + 100 )) \
            archive | tail -n 80
          cat > "$RUNNER_TEMP/export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          sed -i '' 's/^          //' "$RUNNER_TEMP/export.plist"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/SoTay.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            $AUTH | tail -n 60
          echo "### ✅ Đã gửi bản build lên TestFlight. Khoảng 10–20 phút sau sẽ hiện trong app TestFlight." >> "$GITHUB_STEP_SUMMARY"

      - name: Build (không ký – cài bằng Sideloadly)
        if: steps.mode.outputs.signed != 'true'
        run: |
          set -o pipefail
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/SoTay.xcarchive" \
            -skipPackagePluginValidation -skipMacroValidation \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            archive | tail -n 80
          cd "$RUNNER_TEMP"
          mkdir -p Payload
          cp -R SoTay.xcarchive/Products/Applications/App.app Payload/
          zip -qry SoTay.ipa Payload

      - uses: actions/upload-artifact@v4
        if: steps.mode.outputs.signed != 'true'
        with:
          name: SoTay-ipa-${{ github.run_number }}
          path: ${{ runner.temp }}/SoTay.ipa
          retention-days: 30

  web:
    name: Bản web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - name: Bản cũ (giữ ở /cu/ để xuất dữ liệu)
        env:
          FIREBASE_CONFIG: ${{ secrets.FIREBASE_CONFIG }}
        run: npm ci && npm run build
      - name: Bản mới v2
        env:
          FIREBASE_CONFIG: ${{ secrets.FIREBASE_CONFIG }}
        working-directory: web
        run: npm ci && npm test && npm run build && npm run size
      - name: Kiểm tra nhanh giao diện (bản giả lập)
        working-directory: web
        run: |
          pip install playwright==1.* >/dev/null
          python -m playwright install --with-deps chromium >/dev/null
          npm run smoke
      - name: Ghép thư mục web
        run: |
          mkdir -p _site/cu
          cp -r www/. _site/cu/
          cp -r web/dist/. _site/
      - name: Trang đăng nhập Google trên tên miền riêng (/__/auth)
        env:
          FIREBASE_CONFIG: ${{ secrets.FIREBASE_CONFIG }}
        run: |
          # Firebase's sign-in helper, served from sotay.mthangleestudio.com so phone browsers keep the result.
          mkdir -p _site/__/auth _site/__/firebase
          F=https://sotay-mthanglee.firebaseapp.com/__
          curl -fsSL "$F/auth/handler" -o _site/__/auth/handler.html
          curl -fsSL "$F/auth/handler.js" -o _site/__/auth/handler.js
          curl -fsSL "$F/auth/experiments.js" -o _site/__/auth/experiments.js
          curl -fsSL "$F/auth/iframe" -o _site/__/auth/iframe.html
          curl -fsSL "$F/auth/iframe.js" -o _site/__/auth/iframe.js
          # The project has no Firebase Hosting site, so build init.json from the same (public) web config.
          echo "$FIREBASE_CONFIG" | python3 -c "import json,sys; c=json.load(sys.stdin); c['authDomain']='sotay.mthangleestudio.com'; print(json.dumps(c))" > _site/__/firebase/init.json
          ls -la _site/__/auth
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  rules:
    name: Kiểm tra luật phân quyền
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - working-directory: web
        run: npm ci && npm run test:rules

  deploy-web:
    name: Đăng bản web
    needs: [web, rules]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
